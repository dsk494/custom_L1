[workspace]
members = [
    "crates/consensus",
]
resolver = "2"

[workspace.dependencies]
# Use tendermint-rs for all the existing types and utilities
tendermint = { version = "0.38", features = ["secp256k1"] }
tendermint-proto = "0.38"
tendermint-abci = "0.38"
tendermint-rpc = { version = "0.38", features = ["http-client"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Crypto (if needed beyond tendermint)
ed25519-dalek = "2.0"
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1"
anyhow = "1"

